name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: gradetracker
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root --password=rootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: gradetracker
      SESSION_SECRET: test-secret

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Map database host to localhost
        run: echo "127.0.0.1 db" | sudo tee -a /etc/hosts

      - name: Initialize database schema
        run: mysql -h db -P 3306 -u appuser -papppassword gradetracker < schema.sql

      - name: Run Jest Test Suite
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Određivanje Docker tagova
        id: tags
        run: |
          TAGS="${{ secrets.DOCKERHUB_USERNAME }}/student-grade-tracker:latest"
          TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/student-grade-tracker:${{ github.sha }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="$TAGS,${{ secrets.DOCKERHUB_USERNAME }}/student-grade-tracker:${{ github.ref_name }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
